name: Android CI

on:
  push:
    branches-ignore:
      - ci-artifacts
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Give permission to executable
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.1

      - name: Clean
        run: ./gradlew clean --console=plain

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --console=plain 2>&1 | tee unit-tests.log

      - name: Report unit test failures
        if: steps.unit_tests.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          def annotate(message):
              message = message.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::error::{message}')

          log = pathlib.Path('unit-tests.log')
          if log.exists():
              for line in log.read_text(errors='replace').splitlines():
                  stripped = line.strip()
                  if stripped.startswith('e: ') or stripped.startswith('FAILURE:') or 'FAILED' in stripped:
                      annotate(stripped)

          results = pathlib.Path('app/build/test-results/testDebugUnitTest')
          for xml_file in results.glob('*.xml'):
              try:
                  root = ET.parse(xml_file).getroot()
              except Exception:
                  continue
              for testcase in root.iter('testcase'):
                  failure = testcase.find('failure')
                  if failure is None:
                      failure = testcase.find('error')
                  if failure is not None:
                      name = f"{testcase.get('classname')}.{testcase.get('name')}"
                      annotate(f"{name}: {failure.get('message', failure.text or '')}"[:4000])
          PY
          exit 1

      - name: Build debug and release APKs
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --console=plain --stacktrace 2>&1 | tee build.log

      - name: Report build failures
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib

          def annotate(level, message):
              message = message.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::{level}::{message}'[:4000])

          log = pathlib.Path('build.log')
          found = 0
          if log.exists():
              lines = log.read_text(errors='replace').splitlines()
              emitted = 0
              for index, line in enumerate(lines):
                  stripped = line.strip()
                  if (stripped.startswith('e: ') or stripped.startswith('FAILURE:')
                          or stripped.startswith('What went wrong')
                          or stripped.startswith('> Task') and stripped.endswith('FAILED')):
                      if emitted >= 40:
                          break
                      annotate('error', stripped)
                      emitted += 1
                      found += 1
                      for follow_up in lines[index + 1:index + 3]:
                          if follow_up.strip():
                              annotate('error', follow_up.strip())
                              emitted += 1
          PY
          if grep -qE '^(e: |FAILURE:|BUILD FAILED)' build.log 2>/dev/null; then
            exit 1
          fi
          exit 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: build-logs
          path: |
            build.log
            unit-tests.log
            lint.log
            app/build/reports/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload debug apks
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/**/*.apk
          if-no-files-found: warn

      - name: Upload release apks
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: app-release
          path: app/build/outputs/apk/release/**/*.apk
          if-no-files-found: warn

      - name: List build outputs
        if: always()
        run: |
          find . -type f -name '*.apk' -printf '%p (%s bytes)\n' 2>/dev/null | while read -r line; do
            echo "::notice::apk: ${line//'%'/'%25'}"
          done
          find app/build/outputs -maxdepth 4 -type d -printf '%p\n' 2>/dev/null | while read -r line; do
            echo "::notice::outdir: ${line//'%'/'%25'}"
          done
          if [ -f build.log ]; then
            grep -E '^> Task :app:(package|assemble|compile|lint|bundle|merge|dex|process)' build.log | tail -40 | while read -r line; do
              echo "::notice::task: ${line//'%'/'%25'}"
            done
            grep -E 'BUILD (SUCCESSFUL|FAILED)' build.log | while read -r line; do
              echo "::notice::${line//'%'/'%25'}"
            done
          fi

      - name: Publish APKs to a release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t apks < <(find app/build/outputs/apk -name '*.apk' 2>/dev/null)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APKs to publish"
            exit 0
          fi
          gh release view ci-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create ci-latest --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "CI build APKs" --notes "APKs built by CI from commit $GITHUB_SHA."
          gh release upload ci-latest "${apks[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish APKs to the ci-artifacts branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t apks < <(find app/build/outputs/apk -name '*.apk' 2>/dev/null)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APKs to publish"
            exit 0
          fi
          rm -rf /tmp/ci-apks && mkdir -p /tmp/ci-apks
          cp "${apks[@]}" /tmp/ci-apks/
          cd /tmp/ci-apks
          git init -q -b ci-artifacts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI APKs from ${GITHUB_SHA} [skip ci]"
          git push --quiet --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-artifacts

      - name: Run lint
        id: lint
        continue-on-error: true
        run: ./gradlew lintDebug --console=plain 2>&1 | tee lint.log

      - name: Report lint failures
        if: steps.lint.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import pathlib

          def annotate(message):
              message = message.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::error::{message}'[:4000])

          log = pathlib.Path('lint.log')
          if log.exists():
              for line in log.read_text(errors='replace').splitlines():
                  stripped = line.strip()
                  if (': Error:' in stripped or stripped.startswith('FAILURE:')
                          or stripped.startswith('e: ')):
                      annotate(stripped)
          PY
          exit 1
