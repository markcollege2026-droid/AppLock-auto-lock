name: Emulator test (anti-uninstall)

# Boots a headless AVD, installs the debug APK and exercises the anti-uninstall
# screen shielding on a real Android system image. Uploads a full bug report plus
# logcat/dumpsys/screenshot evidence, and mirrors the short text results to the
# ci-emulator branch so they can be read without downloading artifacts.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/7dea5726-applock-auto-lock
    paths:
      - 'app/src/main/**'
      - '.github/workflows/emulator-test.yml'
      - '.github/scripts/emulator-checks.sh'

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Emulator smoke test (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    env:
      API_LEVEL: 34
      SYSTEM_IMAGE: system-images;android-34;google_apis;x86_64
      AVD_NAME: ci34

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4.4.1

      - name: Assemble debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          grep -c -E 'vmx|svm' /proc/cpuinfo || true

      - name: Install emulator and system image
        run: |
          set -x
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "emulator" "$SYSTEM_IMAGE"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n "$AVD_NAME" -k "$SYSTEM_IMAGE" -d pixel_6 --force
          ls -la "$HOME/.android/avd" || true

      - name: Boot emulator
        run: |
          set -x
          "$ANDROID_HOME/emulator/emulator" -avd "$AVD_NAME" \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            -camera-back none -camera-front none > /tmp/emulator.log 2>&1 &
          adb start-server
          timeout 480 bash -c 'until adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" | grep -q 1; do sleep 5; done'
          adb wait-for-device
          adb shell input keyevent 82 || true
          adb devices -l
          tail -20 /tmp/emulator.log || true

      - name: Run anti-uninstall checks
        run: |
          chmod +x .github/scripts/emulator-checks.sh
          .github/scripts/emulator-checks.sh 2>&1 | tee emulator-checks.log

      - name: Collect emulator log
        if: always()
        run: |
          mkdir -p emulator-artifacts
          cp /tmp/emulator.log emulator-artifacts/emulator.log 2>/dev/null || true
          tail -c 200000 emulator-checks.log > emulator-artifacts/emulator-checks-tail.log 2>/dev/null || true
          ls -la emulator-artifacts || true

      - name: Upload emulator artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: emulator-bugreport
          path: emulator-artifacts/**
          if-no-files-found: warn
          retention-days: 7

      - name: Publish results to the ci-emulator branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/ev && mkdir -p /tmp/ev
          cp emulator-artifacts/*.txt /tmp/ev/ 2>/dev/null || true
          for f in emulator-artifacts/logcat-*.txt; do
            [ -f "$f" ] && tail -3000 "$f" > "/tmp/ev/$(basename "$f")" || true
          done
          tail -500 emulator-checks.log > /tmp/ev/emulator-checks.log 2>/dev/null || true
          tail -200 /tmp/emulator.log > /tmp/ev/emulator.log 2>/dev/null || true
          {
            echo "run: ${GITHUB_RUN_ID}"
            echo "sha: ${GITHUB_SHA}"
            echo "conclusion: ${JOB_STATUS:-unknown}"
          } > /tmp/ev/run-info.txt
          ls -la /tmp/ev
          cd /tmp/ev
          git init -q -b ci-emulator
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Emulator results from ${GITHUB_SHA} [skip ci]"
          git push --quiet --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-emulator

      - name: Summarise results
        if: always()
        run: |
          {
            echo "### Emulator run"
            echo '```'
            cat emulator-artifacts/checks.txt 2>/dev/null || echo 'no results file'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
